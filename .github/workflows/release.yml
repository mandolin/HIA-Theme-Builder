# @lang zh-CN HIA-Theme-Builder 桌面端发布工作流（W-tb-P25 三平台矩阵）：
#   ①windows-latest：Electron 便携+NSIS、Tauri 便携+MSI（自签名）——沿用原逻辑；
#   ②macos-latest：Electron dmg+zip、Tauri app+dmg（**未签名/未公证**，按维护者 2026-11-12 定案）；
#   ③ubuntu-latest：Electron AppImage+deb、Tauri AppImage+deb（未签名，Linux 无强制签名要求）。
#   各平台独立 job 构建后汇总到一个 Release，SHA-256 校验和按平台分别生成并合并上传。
#   触发：手动 workflow_dispatch 或版本标签 v*。
#   未签名说明：macOS 首次打开需「右键 → 打开」或在系统设置中允许；Windows 会提示未知发布者。
# @lang en HIA-Theme-Builder desktop release workflow (W-tb-P25 three-platform matrix):
#   windows (signed, as before), macOS (unsigned, per maintainer decision), Linux (unsigned).
#   Each platform builds in its own job; artifacts merge into one Release with per-platform SHA-256.

name: Release desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ===== Windows（签名，沿用原逻辑） =====
  # <lang zh-CN>Electron 便携+NSIS、Tauri 便携+MSI；证书从 secrets 导入。</lang>
  # <lang en>Electron portable+NSIS, Tauri portable+MSI; certificate imported from secrets.</lang>
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Import signing certificate
        shell: pwsh
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $pfxPath = "certs\hia-theme-builder.pfx"
          $secPassword = ConvertTo-SecureString -String $env:WIN_CSC_KEY_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $secPassword

      # 依赖链：core → extractor → web（桌面端复制渲染器）。
      - name: Build core
        working-directory: HIA/core
        run: |
          npm install
          npm run build

      - name: Build extractor
        working-directory: HIA/extractor
        run: |
          npm install
          npm run build

      - name: Build web
        working-directory: HIA/web
        run: |
          npm install
          npm run build

      - name: Build electron
        working-directory: HIA/electron
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npm install
          npm run dist

      - name: Build tauri
        working-directory: HIA/tauri
        run: |
          npm install
          npm run build

      # 收集 Win 产物 + SHA-256。
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          # electron 产物目录为 release/（build.directories.output）；scoped 包名可能建子目录，递归查找。
          # <lang en>electron outputs to release/; recurse to tolerate scoped subdirs.</lang>
          Get-ChildItem -Path "HIA\electron\release" -Recurse -Filter "HIA-Theme-Builder-Electron-*-portable.exe" | Copy-Item -Destination artifacts\
          Get-ChildItem -Path "HIA\electron\release" -Recurse -Filter "HIA-Theme-Builder-Electron-*-setup.exe" | Copy-Item -Destination artifacts\
          Copy-Item "HIA\tauri\src-tauri\target\release\bundle\msi\HIA Theme Builder_*_x64_en-US.msi" artifacts\
          # Tauri v2 只产出 bin 名 exe（v1 另产 productName.exe）——按 bin 名取并重命名为便携版。
          # <lang en>Tauri v2 emits only the bin-named exe; copy and rename it as the portable artifact.</lang>
          Copy-Item "HIA\tauri\src-tauri\target\release\hia-theme-tauri.exe" artifacts\HIA-Theme-Builder-Tauri-portable.exe
          $ver = (Get-Content "HIA\electron\package.json" | ConvertFrom-Json).version
          Write-Host "sealed version: $ver"
          $expected = @(
            "artifacts\HIA-Theme-Builder-Electron-$ver-portable.exe",
            "artifacts\HIA-Theme-Builder-Electron-$ver-setup.exe",
            "artifacts\HIA Theme Builder_${ver}_x64_en-US.msi",
            "artifacts\HIA-Theme-Builder-Tauri-portable.exe"
          )
          foreach ($f in $expected) {
            if (-not (Test-Path $f) -or (Get-Item $f).Length -eq 0) {
              Write-Error "Missing or empty artifact: $f"
              exit 1
            }
            Write-Host "$f : $((Get-Item $f).Length) bytes"
          }
          Set-Location artifacts
          $files = Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS-windows.txt" }
          $hashes = $files | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name }
          $hashes | Out-File -FilePath SHA256SUMS-windows.txt -Encoding utf8
          Get-Content SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: artifacts/

  # ===== macOS（未签名/未公证，按定案） =====
  # <lang zh-CN>Electron dmg+zip、Tauri app+dmg；不签名不公证，Gatekeeper 提示写入发布说明。</lang>
  # <lang en>Electron dmg+zip, Tauri app+dmg; unsigned/unnotarized per decision.</lang>
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: HIA/tauri/src-tauri

      - name: Build core
        working-directory: HIA/core
        run: |
          npm install
          npm run build

      - name: Build extractor
        working-directory: HIA/extractor
        run: |
          npm install
          npm run build

      - name: Build web
        working-directory: HIA/web
        run: |
          npm install
          npm run build

      # Electron macOS：dmg + zip（未签名）。
      - name: Build electron (mac)
        working-directory: HIA/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          npm install
          npm run build
          npx electron-builder --mac dmg zip --publish never

      # Tauri macOS：app + dmg（未签名）。
      - name: Build tauri (mac)
        working-directory: HIA/tauri
        run: |
          npm install
          npm run build:front
          npx tauri build --bundles app,dmg

      - name: Collect macOS artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # electron 产物输出到 release/（build.directories.output）；scoped 包名会建子目录，故递归收集。
          # <lang en>electron outputs to release/; scoped package names create subdirs, so recurse.</lang>
          find HIA/electron/release -maxdepth 2 -name '*.dmg' -exec cp {} artifacts/ \; 2>/dev/null || true
          find HIA/electron/release -maxdepth 2 -name '*-mac.zip' -exec cp {} artifacts/ \; 2>/dev/null || true
          cp "HIA/tauri/src-tauri/target/release/bundle/dmg/"*.dmg artifacts/ 2>/dev/null || true
          ver=$(node -p "require('./HIA/electron/package.json').version")
          echo "sealed version: $ver"
          ls -la artifacts/
          cd artifacts && shasum -a 256 * > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: artifacts/

  # ===== Linux（未签名） =====
  # <lang zh-CN>Electron AppImage+deb、Tauri AppImage+deb；需系统依赖（webkit2gtk 等）。</lang>
  # <lang en>Electron AppImage+deb, Tauri AppImage+deb; requires system webkit2gtk deps.</lang>
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: HIA/tauri/src-tauri

      # Tauri v2 Linux 构建依赖（WebKitGTK 4.1 等）。
      # <lang en>Tauri v2 Linux build dependencies (WebKitGTK 4.1 etc.).</lang>
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          # Ubuntu 22.04+ 用 ayatana 版 appindicator；两者都装以兼容（缺失时 apt 会跳过可选）。
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Build core
        working-directory: HIA/core
        run: |
          npm install
          npm run build

      - name: Build extractor
        working-directory: HIA/extractor
        run: |
          npm install
          npm run build

      - name: Build web
        working-directory: HIA/web
        run: |
          npm install
          npm run build

      - name: Build electron (linux)
        working-directory: HIA/electron
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          npm install
          npm run build
          npx electron-builder --linux AppImage deb --publish never

      - name: Build tauri (linux)
        working-directory: HIA/tauri
        run: |
          npm install
          npm run build:front
          npx tauri build --bundles appimage,deb

      - name: Collect Linux artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # electron 产物输出到 release/（含 scoped 包名子目录），递归收集。
          # <lang en>electron outputs to release/ (scoped subdirs); collect recursively.</lang>
          find HIA/electron/release -maxdepth 2 \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} artifacts/ \; 2>/dev/null || true
          cp HIA/tauri/src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp HIA/tauri/src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          ver=$(node -p "require('./HIA/electron/package.json').version")
          echo "sealed version: $ver"
          ls -la artifacts/
          cd artifacts && sha256sum * > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: artifacts/

  # ===== 汇总发布（三平台产物合并到一个 Release） =====
  # <lang zh-CN>三平台 job 完成后统一下载产物并创建 Release；任一平台失败则不发布（避免半套产物）。</lang>
  # <lang en>Aggregates all three platforms into one Release; any platform failure blocks publishing.</lang>
  publish:
    needs: [release-windows, release-macos, release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'manual' }}
          name: Release ${{ github.ref_name || 'manual' }}
          draft: false
          prerelease: false
          files: |
            artifacts/*
          body: |
            Desktop artifacts (three platforms)

            Windows: Electron portable + NSIS installer; Tauri portable + MSI (self-signed).
            macOS: Electron dmg + zip; Tauri dmg (UNSIGNED / NOT NOTARIZED).
            Linux: Electron AppImage + deb; Tauri AppImage + deb (unsigned).

            macOS first launch: right-click the app and choose Open (or allow it in System Settings > Privacy & Security).
            Windows may warn about an unknown publisher - choose "Run anyway".

            Per-platform checksums: SHA256SUMS-windows.txt / -macos.txt / -linux.txt.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
