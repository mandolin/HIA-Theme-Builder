# @lang zh-CN HIA/web 发布到 GitHub Pages 的工作流：构建前先对 core/web/electron/tauri 四端做构建与测试校验，
#   并对 tauri 的 Rust 后端做 cargo check（遗留问题清理 C7：此前 CI 不编译 Rust 侧）；
#   任一校验失败则阻断部署；通过后部署 web 的 dist 到 Pages。
# @lang en GitHub Pages workflow for HIA/web: verify build+test for core/web/electron/tauri before deploy,
#   plus cargo check for the tauri Rust backend (cleanup C7: CI previously never compiled the Rust side);
#   any failure blocks deploy; then deploy web dist to Pages.

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'HIA/core/**'
      - 'HIA/tdon/**'
      - 'HIA/web/**'
      - 'HIA/electron/**'
      - 'HIA/tauri/**'
      - 'docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # <lang zh-CN>用 mise 安装与本地一致的 Node 版本（读取 .mise.toml，当前为 Node 22 LTS）。</lang>
      # <lang en>Use mise to install the same Node version as local (.mise.toml, currently Node 22 LTS).</lang>
      - uses: jdx/mise-action@v2

      # ----- core：构建 + 单测（领域算法的事实来源）-----
      # <lang zh-CN>先构建 core 到本地 dist，供其余端以 file: 链接消费；随后跑单测。</lang>
      # <lang en>Build core to local dist first (consumed via file: by other ends), then run its unit tests.</lang>
      - name: Verify core
        working-directory: HIA/core
        run: |
          npm install
          npm test

      # ----- extractor：先构建（web/electron/tauri 均依赖其 dist 类型与 bundle）-----
      # <lang zh-CN>extractor 经 file: 链接被 web 等消费；CI 全新 checkout 须先 install+build 产出 dist/.d.ts 与 scanner bundle。</lang>
      # <lang en>extractor is consumed via file: by web etc.; CI fresh checkout must install+build to emit dist/.d.ts and scanner bundle.</lang>
      - name: Build extractor
        working-directory: HIA/extractor
        run: |
          npm install
          npm run build

      # ----- tdon：构建 + 单测（独立包 @hia/tdon，web 消费其 dist）-----
      # <lang zh-CN>TDON 已从 core 拆出（ADR-010）；web 依赖它，故须在 web 之前构建并跑单测。</lang>
      # <lang en>TDON is its own package (ADR-010) and web depends on it, so build+test it before web.</lang>
      - name: Verify tdon
        working-directory: HIA/tdon
        run: |
          npm install
          npm test

      # ----- web：构建（tsc + vite）-----
      # <lang zh-CN>web 消费本地 core/extractor/tdon dist；GITHUB_PAGES 触发基路径兼容。</lang>
      # <lang en>web consumes local core/extractor/tdon dist; GITHUB_PAGES enables base-path compatibility.</lang>
      - name: Verify web
        working-directory: HIA/web
        env:
          GITHUB_PAGES: '1'
        run: |
          npm install
          npm run build

      # ----- a11y：axe 无障碍门禁（生产 dist，light+dark 双模式，基线比对）-----
      # <lang zh-CN>ubuntu-latest 预装 Chrome（channel:'chrome' 直接命中）；新增违规即失败，阻断 Pages 部署。</lang>
      # <lang en>ubuntu-latest ships Chrome (channel:'chrome'); any new violation fails and blocks the Pages deploy.</lang>
      - name: A11y gate (axe)
        working-directory: HIA/web
        run: |
          npm run build
          node scripts/axe-scan.mjs

      # ----- 布局回归门禁（W-tb-P37 维护者反馈）：防"已修复的布局问题随新面板复发" -----
      # <lang zh-CN>两栏/单栏模式断言：侧栏轨 560px 不被撑破、主栏不被挤占、侧栏无横向裁切、
      #   宽表格面板容器内滚动、宽面板不得混入侧栏。新增面板必须过此门禁。
      # <lang en>Two/single-column assertions: sidebar track stays 560px, main keeps its width, no sidebar
      #   clipping, wide tables scroll in-container, wide panels never join the sidebar. New panels must pass.</lang>
      - name: Layout regression gate
        working-directory: HIA/web
        run: node scripts/layout-regression.mjs

      # ----- electron：编译 + SSRF 单测（不下载 Electron 二进制）-----
      # <lang zh-CN>--ignore-scripts 跳过 Electron 二进制下载以加速 CI；仅验证 tsc + vitest(ssrf)。</lang>
      # <lang en>--ignore-scripts skips the Electron binary download to speed CI; only tsc + vitest(ssrf) are verified.</lang>
      - name: Verify electron
        working-directory: HIA/electron
        run: |
          npm install --ignore-scripts
          npm run build
          npm test

      # ----- tauri：前端编译 + SSRF 单测（Rust 端到端启动在目标环境复验）-----
      # <lang zh-CN>tauri 前端以 copy-front 编译；Rust 侧编译由独立的 tauri-rust-check job 覆盖。</lang>
      # <lang en>tauri front-end compiled via copy-front; the Rust side is covered by the dedicated tauri-rust-check job.</lang>
      - name: Verify tauri
        working-directory: HIA/tauri
        run: |
          npm install --ignore-scripts
          npm run build:front
          npm test

      # 组装站点：web 应用 + docs/ 文档子站（W-tb-P14）——同一 Pages 产物、同一域名路径。
      # <lang en>Assemble site: web app plus docs/ subsite in one Pages artifact.</lang>
      - name: Assemble site (app + docs subsite)
        shell: bash
        run: |
          mkdir -p stage/docs
          cp -r HIA/web/dist/* stage/
          cp -r docs-site/* stage/docs/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: stage

  # ----- tauri Rust 静态检查（C7）：windows runner 无需 webkit2gtk 系统依赖，cargo check 覆盖编译正确性 -----
  # <lang zh-CN>不运行需要系统 Chrome 的集成测试（目标环境复验）；仅 cargo check 保证 Rust 侧随每次改动可编译。
  #   Cargo.lock 已入库，--locked 保证依赖解析与本地一致；Swatinem/rust-cache 缓存 target 加速。</lang>
  # <lang en>No Chrome-dependent integration tests here (target env re-verifies); cargo check only keeps the Rust
  #   side compiling on every change. Cargo.lock is committed (--locked pins resolution); rust-cache speeds up builds.</lang>
  tauri-rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: HIA/tauri/src-tauri
      # render.rs include_str! 引用 extractor/dist/browser-scanner.bundle.js（编译期嵌入）；
      #   本 job 独立 checkout，须先构建 core（extractor 的 file: 依赖）再构建 extractor 产出 bundle，
      #   否则 cargo check 找不到文件（Pages 上一次运行失败根因）。
      # <lang en>render.rs embeds the scanner via include_str!; build core (extractor's file: dep) then extractor so cargo check finds the bundle.</lang>
      - name: Build core (extractor dependency)
        working-directory: HIA/core
        run: |
          npm install
          npm run build
      - name: Build extractor (scanner bundle for include_str!)
        working-directory: HIA/extractor
        run: |
          npm install
          npm run build
      # tauri v2 conf frontendDist="dist"：generate_context! 仍要求该目录存在（v1 devPath → v2 frontendDist）；
      #   本 job 不跑前端复制（build job 已覆盖），创建占位目录即可（本地产物已在库内但 CI 全新 checkout 无）。
      # <lang en>generate_context! requires devPath to exist at compile time; create a placeholder (front-end is verified in the build job).</lang>
      - name: Ensure tauri devPath placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "HIA\tauri\src-tauri\dist" -Force
          Set-Content -Path "HIA\tauri\src-tauri\dist\index.html" -Value "<!doctype html><title>placeholder</title>"
      - name: Cargo check (tauri src-tauri)
        working-directory: HIA/tauri/src-tauri
        run: cargo check --locked

  deploy:
    needs: [build, tauri-rust-check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
