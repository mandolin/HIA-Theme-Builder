<!doctype html>
<!-- fixture 03: 黑白单色品牌（不应被硬过滤） -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<title>Mono Black White Brand</title>
<style>
  :root{ --brand:#111111; }
  body{ margin:0; background:#fff; color:var(--brand); font-family:Georgia,serif; }
  .logo{ color:var(--brand); font-size:32px; font-weight:700; padding:20px; }
  .rule{ border-top:2px solid var(--brand); }
  .tag{ color:#000; }
</style>
</head>
<body>
  <div class="logo brand-mark">MONO</div>
  <hr class="rule">
  <span class="tag">Minimal monochrome identity</span>
</body>
</html>
