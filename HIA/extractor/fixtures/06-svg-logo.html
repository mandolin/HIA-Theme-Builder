<!doctype html>
<!-- fixture 06: SVG logo（fill/stroke 作为 icon/brand 证据） -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#059669">
<title>SVG Logo</title>
<style>
  :root{ --brand:#059669; }
  body{ margin:0; font-family:system-ui,sans-serif; background:#fff; color:#064E3B; }
  .brandbar{ background:var(--brand); padding:16px; }
</style>
</head>
<body>
  <div class="brandbar">
    <svg width="40" height="40" viewBox="0 0 40 40" class="logo-svg">
      <circle cx="20" cy="20" r="16" fill="#FFFFFF"/>
      <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="#059669" stroke="#047857" stroke-width="2"/>
    </svg>
  </div>
</body>
</html>
