<!doctype html>
<!-- @lang zh-CN Electron 渲染页：主题操作台 + 网址取色。 @lang en Electron renderer: theme console + URL extraction. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>HIA 主题构建器 · 桌面版</title>
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>
    <header class="topbar"><h1>HIA 主题构建器 · 桌面版</h1></header>
    <main class="layout">
      <section class="panel">
        <h2>主题操作台</h2>
        <label>主色 <input type="color" id="primary" value="#0047AB" /></label>
        <label>副色 <input type="color" id="secondary" value="#00A8D3" /></label>
        <h3>从网址获取颜色集</h3>
        <div class="row">
          <input type="text" id="url" placeholder="https://example.com" size="40" />
          <button id="extract">取色</button>
        </div>
        <pre id="extractOut">输入公开网址并点击取色（已启用 SSRF 安全校验）。</pre>
      </section>
      <section class="panel">
        <h2>取色结果</h2>
        <div id="result"></div>
      </section>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
