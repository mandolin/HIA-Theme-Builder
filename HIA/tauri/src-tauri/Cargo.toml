# @lang zh-CN Tauri Rust 后端清单：窗口 + 取色命令。SSRF 校验在此端再确认一次。
# @lang en Tauri Rust backend manifest: window + extraction command. SSRF re-checked here.
[package]
name = "hia-theme-tauri"
version = "1.3.1"
description = "HIA-Theme-Builder desktop (Tauri) backend"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Stage A（W-tb-P49）：仅引入 crates（编译无害）；插件注册与 plugins.updater 配置在
#   密钥就绪后于 Stage B 一并启用（Tauri updater 强制签名，无密钥时注册会失败）。
# <lang en>Stage A (W-tb-P49): crates only (harmless to compile); plugin registration and the
#   plugins.updater config land in Stage B once signing keys exist (Tauri updater mandates signatures).</lang>
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chromiumoxide = "0.9"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[features]
# @lang zh-CN>默认特性；custom-protocol 由 Tauri 在 release 构建时注入，用于内嵌前端资源。
# @lang en>Default features; custom-protocol is injected by Tauri at release build to embed front-end assets.
default = []
custom-protocol = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
