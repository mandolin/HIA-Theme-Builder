# @lang zh-CN Tauri Rust 后端清单：窗口 + 取色命令。SSRF 校验在此端再确认一次。
# @lang en Tauri Rust backend manifest: window + extraction command. SSRF re-checked here.
[package]
name = "hia-theme-tauri"
version = "0.7.0"
description = "HIA-Theme-Builder desktop (Tauri) backend"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chromiumoxide = "0.9"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[features]
# @lang zh-CN>默认特性；custom-protocol 由 Tauri 在 release 构建时注入，用于内嵌前端资源。
# @lang en>Default features; custom-protocol is injected by Tauri at release build to embed front-end assets.
default = []
custom-protocol = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
